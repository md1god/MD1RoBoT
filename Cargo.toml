[package]
name = "md1robot"
version = "0.1.0"
edition = "2021"
description = "محرك تطور ذاتي متعدد اللغات يعمل محلياً"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
blake3 = "1.5"
ureq = { version = "2", features = ["json"] }
scraper = "0.18"
url = "2.5"
which = "6.0"
libc = "0.2"
tree-sitter = "0.22"
tree-sitter-grammars = "0.1"
config = "0.13"
toml = "0.8"
log = "0.4"
env_logger = "0.10"

[dev-dependencies]
tempfile = "3.8"
