[toolchain]
solana_version = "2.1.0"
anchor_version = "0.31.0"

[features]
seeds = true
skip-lint = false

[programs.mainnet]
md1usd = "Md1usdSoLXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"

[registry]
url = "https://api.mainnet-beta.solana.com"

[provider]
cluster = "mainnet"
wallet = "/tmp/deployer.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
