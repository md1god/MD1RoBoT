name: MD1RoBoT Docker

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GENESIS_IMAGE: dido599999/genesis-core:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: dido599999
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            dido599999/genesis-core:latest

      - name: Create configuration file
        run: |
          cat > config.toml <<'EOF'
          [evolution]
          max_cycles = 5
          health_threshold = 0.7
          [fitness_weights]
          performance = 0.35
          memory = 0.20
          reliability = 0.30
          maintainability = 0.15
          [models]
          rust = "deepseek-r1:7b"
          python = "deepseek-r1:7b"
          javascript = "deepseek-r1:7b"
          c = "deepseek-r1:7b"
          cpp = "deepseek-r1:7b"
          default = "deepseek-r1:7b"
          [kreza]
          use_ensemble = false
          ensemble_models = ["deepseek-r1:7b"]
          EOF

      - name: Pull and run genesis core container
        run: |
          echo "${{ secrets.DOCKER_PAT }}" | docker login -u "dido599999" --password-stdin
          docker pull "${GENESIS_IMAGE}"
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            --user "$(id -u):$(id -g)" \
            -e HOME=/app \
            -e OLLAMA_MODELS=/app/.ollama \
            "${GENESIS_IMAGE}" \
            sh -c "cargo build --release && ./target/release/md1robot"
