name: Build and Verify Solana Program

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: 1.18.26
  ANCHOR_VERSION: 0.30.1
  PROGRAM_ID: 3fN2LAt47q3oSgNq4dJZt4DuAh5yJw6mb6B3dRYJGHa8

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config build-essential libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.avm
            target
          key: ${{ runner.os }}-cargo-${{ env.ANCHOR_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.ANCHOR_VERSION }}-

      - name: Install Solana CLI ${{ env.SOLANA_VERSION }}
        run: |
          if ! command -v solana >/dev/null 2>&1; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI ${{ env.ANCHOR_VERSION }} (with time crate fix)
        run: |
          if command -v anchor >/dev/null 2>&1 && anchor --version | grep -q "${{ env.ANCHOR_VERSION }}"; then
            echo "anchor-cli already installed"
            exit 0
          fi
          rm -rf /tmp/anchor-src
          git clone --depth 1 --branch v${{ env.ANCHOR_VERSION }} https://github.com/coral-xyz/anchor /tmp/anchor-src
          cd /tmp/anchor-src
          cargo update -p time --precise 0.3.36
          cargo install --path cli --locked --force
          cd -

      - name: Verify toolchain versions
        run: |
          solana --version
          anchor --version
          rustc --version

      - name: Build program (release)
        run: anchor build -- --release

      - name: Package build output as zip
        run: |
          mkdir -p release-package
          cp -r target/deploy release-package/ 2>/dev/null || true
          cp -r target/idl release-package/ 2>/dev/null || true
          if [ -d target/verifiable ]; then
            cp -r target/verifiable release-package/
          fi
          cd release-package
          zip -r ../anchor-build-${{ github.sha }}.zip .
          cd ..

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: anchor-build-${{ github.sha }}
          path: anchor-build-${{ github.sha }}.zip
          retention-days: 14
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config build-essential libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.avm
            target
          key: ${{ runner.os }}-cargo-${{ env.ANCHOR_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.ANCHOR_VERSION }}-

      - name: Install solana-verify CLI
        run: cargo install solana-verify --locked

      - name: Install Solana CLI ${{ env.SOLANA_VERSION }}
        run: |
          if ! command -v solana >/dev/null 2>&1; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI ${{ env.ANCHOR_VERSION }} (with time crate fix)
        run: |
          if command -v anchor >/dev/null 2>&1 && anchor --version | grep -q "${{ env.ANCHOR_VERSION }}"; then
            echo "anchor-cli already installed"
            exit 0
          fi
          rm -rf /tmp/anchor-src
          git clone --depth 1 --branch v${{ env.ANCHOR_VERSION }} https://github.com/coral-xyz/anchor /tmp/anchor-src
          cd /tmp/anchor-src
          cargo update -p time --precise 0.3.36
          cargo install --path cli --locked --force
          cd -

      - name: Build program (release)
        run: anchor build -- --release

      - name: Verify on mainnet
        run: |
          anchor verify -p md1usd_solana 3fN2LAt47q3oSgNq4dJZt4DuAh5yJw6mb6B3dRYJGHa8 --provider.cluster mainnet
      - name: Package verify output as zip
        if: always()
        run: |
          mkdir -p verify-package
          cp -r target/deploy verify-package/ 2>/dev/null || true
          cp -r target/idl verify-package/ 2>/dev/null || true
          cd verify-package
          zip -r ../verify-result-${{ github.sha }}.zip .
          cd ..

      - name: Upload verify zip artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-result-${{ github.sha }}
          path: verify-result-${{ github.sha }}.zip
          retention-days: 14
          if-no-files-found: warn
