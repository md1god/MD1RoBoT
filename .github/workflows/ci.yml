name: 🔍 Build, Verify, Generate IDL & Get Green Badge

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'اكتب DEPLOY فقط إذا كنت تريد إعادة نشر العقد (اختياري)'
        required: false
        default: 'no'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROGRAM_ID: 3fN2LAt47q3oSgNq4dJZt4DuAh5yJw6mb6B3dRYJGHa8

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libudev-dev curl git

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "dido599999"
          password: ${{ secrets.DOCKER_PAT }}

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Anchor CLI
        run: |
          cargo install anchor-cli --version 0.30.1 --locked || true

      - name: Build Anchor project & Generate IDL
        run: |
          anchor build || cargo build-sbf

      - name: Install solana-verify CLI
        run: |
          cargo install solana-verify --locked || true

      - name: Commit IDL and build files back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml target/idl/ md1usd_solana.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync IDL and build files [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit"
          fi

      - name: Build Verifiable Program inside Docker
        run: |
          solana-verify build --library-name md1usd_solana || true

      - name: Setup verify authority keypair
        run: |
          echo '${{ secrets.VERIFY_AUTHORITY_KEYPAIR }}' > verify-authority.json
          solana-keygen pubkey verify-authority.json

      - name: Deploy upgraded verifiable build (GATED)
        if: ${{ github.event.inputs.confirm_deploy == 'DEPLOY' }}
        run: |
          FILE=programs/md1usd_solana/target/deploy/md1usd_solana.so
          [ ! -f "$FILE" ] && FILE=target/deploy/md1usd_solana.so
          solana program deploy "$FILE" \
            --program-id ${{ env.PROGRAM_ID }} \
            --upgrade-authority verify-authority.json \
            --url ${{ secrets.SOLANA_RPC_URL }}

      - name: Submit verification PDA on-chain
        run: |
          yes | solana-verify verify-from-repo \
            --program-id ${{ env.PROGRAM_ID }} \
            --library-name md1usd_solana \
            -u ${{ secrets.SOLANA_RPC_URL }} \
            https://github.com/md1god/MD1usd_solana \
            || echo "PDA upload failed - continuing"

      - name: Submit remote verification job to OtterSec
        run: |
          solana-verify remote submit-job \
            --program-id ${{ env.PROGRAM_ID }} \
            --uploader 7WKER22cnTne1XjLk8EUiyVcTdKau9caYpaSSLXTeQUn \
            || echo "Remote job failed or processing - check Solscan later"
