name: 🔍 Build, Verify, Generate IDL & Get Green Badge
on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'اكتب DEPLOY فقط إذا كنت تريد إعادة نشر العقد (اختياري، اتركه فارغاً للحصول على البادج فقط)'
        required: false
        default: 'no'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
env:
  PROGRAM_ID: 3fN2LAt47q3oSgNq4dJZt4DuAh5yJw6mb6B3dRYJGHa8
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (C compiler & OpenSSL)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libudev-dev

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "dido599999"
          password: ${{ secrets.DOCKER_PAT }}

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Fix declared rust-version to match the verification toolchain (1.75.0)
        run: |
          sed -i 's/rust-version = "1.89.0"/rust-version = "1.75.0"/' Cargo.toml

      - name: Switch to Stable Rust to install AVM & Anchor CLI
        uses: dtolnay/rust-toolchain@stable

      - name: Install AVM and Anchor v0.30.1 safely
        run: |
          cargo install avm --locked --force
          avm install 0.30.1
          avm use 0.30.1

      - name: Build Anchor project & Generate IDL
        run: |
          anchor build

      - name: Install solana-verify CLI
        run: |
          cargo install solana-verify --locked

      - name: Install Nightly Rust (to resolve minimal-version lockfile)
        uses: dtolnay/rust-toolchain@nightly

      - name: Generate lockfile using OLDEST compatible dependency versions
        run: |
          rm -f Cargo.lock
          cargo +nightly generate-lockfile -Z minimal-versions

      - name: Fix Cargo.lock version for Rust 1.75 compatibility
        run: |
          sed -i '0,/^version = /{s/^version = 4/version = 3/}' Cargo.lock

      - name: Commit IDL and verified build files back to repo (Crucial for OtterSec)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock target/idl/ md1usd_solana.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync IDL and verified build files [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit - files already in sync"
          fi

      - name: Build Verifiable Program inside Docker
        run: |
          solana-verify build --library-name md1usd_solana

      - name: Compute hash of the local file and on-chain program (strip trailing zero bytes)
        run: |
          FILE=programs/md1usd_solana/target/deploy/md1usd_solana.so
          if [ ! -f "$FILE" ]; then
            FILE=target/deploy/md1usd_solana.so
          fi
          
          echo "Using local file: $FILE"
          ORIGINAL_SIZE=$(stat -c%s "$FILE")
          STRIPPED_SIZE=$(python3 -c "
          data = open('$FILE','rb').read().rstrip(b'\x00')
          print(len(data))
          ")
          head -c "$STRIPPED_SIZE" "$FILE" > stripped.so
          echo "Local file - Original size: $ORIGINAL_SIZE, Stripped size: $STRIPPED_SIZE"
          echo "Local stripped hash:"
          sha256sum stripped.so

          echo "Fetching on-chain program..."
          solana program dump ${{ env.PROGRAM_ID }} onchain.so --url ${{ secrets.SOLANA_RPC_URL }}
          ONCHAIN_STRIPPED_SIZE=$(python3 -c "
          data = open('onchain.so','rb').read().rstrip(b'\x00')
          print(len(data))
          ")
          head -c "$ONCHAIN_STRIPPED_SIZE" onchain.so > onchain_stripped.so
          echo "On-chain stripped hash:"
          sha256sum onchain_stripped.so
          
          if cmp -s stripped.so onchain_stripped.so; then
            echo "SUCCESS: Local and on-chain hashes match perfectly!"
          else
            echo "WARNING: Hashes do not match yet."
          fi

      - name: Setup verify authority keypair
        run: |
          echo '${{ secrets.VERIFY_AUTHORITY_KEYPAIR }}' > verify-authority.json
          solana-keygen pubkey verify-authority.json

      - name: Deploy upgraded verifiable build (GATED - only runs if explicitly confirmed)
        if: ${{ github.event.inputs.confirm_deploy == 'DEPLOY' }}
        run: |
          FILE=programs/md1usd_solana/target/deploy/md1usd_solana.so
          [ ! -f "$FILE" ] && FILE=target/deploy/md1usd_solana.so
          solana program deploy "$FILE" \
            --program-id ${{ env.PROGRAM_ID }} \
            --upgrade-authority verify-authority.json \
            --url ${{ secrets.SOLANA_RPC_URL }}

      - name: Submit verification PDA on-chain (Force Solana v1.18.26)
        run: |
          yes | solana-verify verify-from-repo \
            --program-id ${{ env.PROGRAM_ID }} \
            --library-name md1usd_solana \
            --solana-version 1.18.26 \
            -u ${{ secrets.SOLANA_RPC_URL }} \
            https://github.com/md1god/MD1usd_solana \
            || echo "PDA upload failed - continuing"

      - name: Submit remote verification job to OtterSec (Force Solana v1.18.26)
        run: |
          solana-verify remote submit-job \
            --program-id ${{ env.PROGRAM_ID }} \
            --uploader 7WKER22cnTne1XjLk8EUiyVcTdKau9caYpaSSLXTeQUn \
            --solana-version 1.18.26 \
            || echo "Remote job failed or processing - check Solscan later"
