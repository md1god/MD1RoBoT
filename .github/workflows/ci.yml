name: 🔍 Build, Verify & Get Green Badge

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'اكتب DEPLOY فقط إذا كنت تريد إعادة نشر العقد (اختياري)'
        required: false
        default: 'no'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROGRAM_ID: 3fN2LAt47q3oSgNq4dJZt4DuAh5yJw6mb6B3dRYJGHa8
  LIBRARY_NAME: md1usd_solana
  REPO_URL: https://github.com/md1god/MD1usd_solana
  # ثبّت هذه الأرقام على نفس الإصدارات المستخدمة وقت أول نشر فعلي للبرنامج
  SOLANA_CLI_VERSION: 1.18.22
  ANCHOR_CLI_VERSION: 0.30.1
  RUST_TOOLCHAIN: 1.75.0
  SOLANA_VERIFY_VERSION: 0.3.1
  # صورة Docker الثابتة التي يجب أن يُبنى بها البرنامج دومًا (بدلاً من ترك solana-verify يستنتجها تلقائيًا)
  VERIFY_BASE_IMAGE: solanafoundation/solana-verifiable-build:1.18.22

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libudev-dev curl git

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "dido599999"
          password: ${{ secrets.DOCKER_PAT }}

      # ---- تثبيت Rust بإصدار محدد بدقة (وليس "stable") ----
      - name: Setup pinned Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Confirm active Rust version
        run: |
          rustup override set ${{ env.RUST_TOOLCHAIN }}
          rustc --version
          cargo --version

      # ---- تثبيت Solana CLI بإصدار محدد بدقة (وليس stable/latest) ----
      - name: Install pinned Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_CLI_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Confirm Solana CLI version
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version

      # ---- تثبيت Anchor بإصدار محدد بدقة عبر AVM ----
      - name: Install AVM and pinned Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install ${{ env.ANCHOR_CLI_VERSION }}
          avm use ${{ env.ANCHOR_CLI_VERSION }}
          echo "$HOME/.avm/bin" >> $GITHUB_PATH

      - name: Confirm Anchor version
        run: |
          export PATH="$HOME/.avm/bin:$PATH"
          anchor --version

      # ---- تثبيت solana-verify بإصدار محدد بدقة (وليس آخر إصدار) ----
      - name: Install pinned solana-verify CLI
        run: |
          cargo install solana-verify --version ${{ env.SOLANA_VERIFY_VERSION }} --locked --force

      - name: Confirm solana-verify version
        run: solana-verify --version

      # ---- لا تحدّث Cargo.lock تلقائيًا إطلاقًا هنا ----
      # إن احتجت تثبيت نسخة معينة من ahash افعلها يدويًا محليًا مرة واحدة
      # وادفعها كـ commit ثابت، ولا تجعل CI يغيّرها.

      - name: Build with Anchor (sanity check only, not used for verification)
        run: |
          anchor build || true

      # ---- البناء القابل للتحقق داخل Docker عبر صورة مثبّتة بدقة (وليس استنتاجًا تلقائيًا) ----
      - name: Build Verifiable Program inside pinned Docker image
        run: |
          solana-verify build \
            --library-name ${{ env.LIBRARY_NAME }} \
            --base-image ${{ env.VERIFY_BASE_IMAGE }}

      - name: Compute local stripped hash
        run: |
          FILE=target/deploy/${{ env.LIBRARY_NAME }}.so
          [ ! -f "$FILE" ] && FILE=programs/${{ env.LIBRARY_NAME }}/target/deploy/${{ env.LIBRARY_NAME }}.so
          echo "Using file: $FILE"
          STRIPPED_SIZE=$(python3 -c "
          data = open('$FILE','rb').read().rstrip(b'\x00')
          print(len(data))
          ")
          head -c "$STRIPPED_SIZE" "$FILE" > local_stripped.so
          echo "Local stripped hash:"
          sha256sum local_stripped.so

      - name: Setup verify authority keypair
        run: |
          echo '${{ secrets.VERIFY_AUTHORITY_KEYPAIR }}' > verify-authority.json
          solana-keygen pubkey verify-authority.json

      # ---- نشر (اختياري ومحمي ببوابة يدوية) ----
      - name: Deploy upgraded verifiable build (GATED)
        if: ${{ github.event.inputs.confirm_deploy == 'DEPLOY' }}
        run: |
          FILE=target/deploy/${{ env.LIBRARY_NAME }}.so
          [ ! -f "$FILE" ] && FILE=programs/${{ env.LIBRARY_NAME }}/target/deploy/${{ env.LIBRARY_NAME }}.so
          solana program deploy "$FILE" \
            --program-id ${{ env.PROGRAM_ID }} \
            --upgrade-authority verify-authority.json \
            --url ${{ secrets.SOLANA_RPC_URL }}

      - name: Get on-chain stripped hash
        run: |
          solana program dump ${{ env.PROGRAM_ID }} onchain.so --url ${{ secrets.SOLANA_RPC_URL }}
          ONCHAIN_STRIPPED_SIZE=$(python3 -c "
          data = open('onchain.so','rb').read().rstrip(b'\x00')
          print(len(data))
          ")
          head -c "$ONCHAIN_STRIPPED_SIZE" onchain.so > onchain_stripped.so
          echo "On-chain stripped hash:"
          sha256sum onchain_stripped.so

      - name: Compare hashes explicitly
        run: |
          LOCAL_HASH=$(sha256sum local_stripped.so | awk '{print $1}')
          ONCHAIN_HASH=$(sha256sum onchain_stripped.so | awk '{print $1}')
          echo "Local:    $LOCAL_HASH"
          echo "On-chain: $ONCHAIN_HASH"
          if [ "$LOCAL_HASH" = "$ONCHAIN_HASH" ]; then
            echo "✅ HASH MATCH"
          else
            echo "❌ HASH MISMATCH"
            exit 1
          fi

      # ---- رفع بيانات التحقق على السلسلة (PDA) ----
      - name: Submit verification PDA on-chain
        run: |
          yes | solana-verify verify-from-repo \
            --program-id ${{ env.PROGRAM_ID }} \
            --library-name ${{ env.LIBRARY_NAME }} \
            --base-image ${{ env.VERIFY_BASE_IMAGE }} \
            -u ${{ secrets.SOLANA_RPC_URL }} \
            ${{ env.REPO_URL }}

      # ---- إرسال مهمة التحقق البعيدة إلى OtterSec لإظهار الشارة الخضراء ----
      - name: Submit remote verification job to OtterSec
        run: |
          solana-verify remote submit-job \
            --program-id ${{ env.PROGRAM_ID }} \
            --uploader 7WKER22cnTne1XjLk8EUiyVcTdKau9caYpaSSLXTeQUn
