name: Build, Verify and Deploy (New Program)

on:
  workflow_dispatch:

env:
  LIBRARY_NAME: md1usd_solana
  ANCHOR_VERSION: 0.31.1
  SOLANA_VERSION: 2.1.0

jobs:
  build-verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Solana CLI (Agave)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install AVM
        run: |
          cargo install avm --git https://github.com/solana-foundation/anchor --tag v${{ env.ANCHOR_VERSION }} --locked --force
          echo "$HOME/.avm/bin" >> $GITHUB_PATH

      - name: Install pinned Anchor CLI via AVM
        run: |
          avm install ${{ env.ANCHOR_VERSION }}
          avm use ${{ env.ANCHOR_VERSION }}
          anchor --version

      - name: Setup Wallet Keypair (new program, fresh address)
        run: |
          echo '${{ secrets.VERIFY_AUTHORITY_KEYPAIR }}' > id.json
          solana-keygen pubkey id.json

      - name: Build verifiable program (Docker handled internally by Anchor)
        run: |
          anchor build --verifiable

      - name: Show local executable hash
        run: |
          FILE=$(find target/deploy -name "*.so" | head -n 1)
          echo "SO_FILE=$FILE" >> $GITHUB_ENV
          echo "Using file: $FILE"
          sha256sum "$FILE"

      - name: Deploy new program (fresh address, generated automatically)
        run: |
          solana program deploy "$SO_FILE" \
            --keypair id.json \
            --url https://api.mainnet-beta.solana.com

      - name: Show deployed program address
        run: |
          KEYPAIR_JSON=$(find target/deploy -name "*-keypair.json" | head -n 1)
          echo "PROGRAM_ID=$(solana-keygen pubkey "$KEYPAIR_JSON")" >> $GITHUB_ENV
          echo "New Program ID: $(solana-keygen pubkey "$KEYPAIR_JSON")"

      - name: Verify against repo
        run: |
          yes | anchor verify "$PROGRAM_ID" \
            --provider.cluster mainnet
