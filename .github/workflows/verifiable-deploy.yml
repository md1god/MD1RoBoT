name: Production Verifiable Build, Deploy and Verify (Mainnet - Fixed 2-Stage)

on:
  workflow_dispatch:
    inputs:
      uploader_pubkey:
        description: 'عنوان محفظة الـ Uploader لـ OtterSec'
        required: false
        default: '7WKER22cnTne1XjLk8EUiyVcTdKau9caYpaSSLXTeQUn'

permissions:
  contents: read

env:
  LIBRARY_NAME: md1usd_solana
  ANCHOR_VERSION: 0.31.1
  SOLANA_VERSION: 2.1.0
  RUST_VERSION: 1.81.0
  SOLANA_VERIFY_VERSION: 0.4.11
  SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
  RUSTFLAGS: "-D warnings"

jobs:
  # ==========================================
  # المرحلة الأولى: البناء المعزول وحساب الهاش
  # ==========================================
  build:
    name: 1. Verifiable Build & Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies & Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libssl-dev libudev-dev libclang-dev protobuf-compiler grep coreutils
          sudo systemctl start docker

      - name: Install Pinned Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Install Anchor CLI via AVM (Solves EACCES Permission Bug)
        run: |
          set -eo pipefail
          cargo install --git https://github.com/coral-xyz/anchor --tag v${{ env.ANCHOR_VERSION }} avm --locked
          avm install ${{ env.ANCHOR_VERSION }}
          avm use ${{ env.ANCHOR_VERSION }}
          echo "$HOME/.avm/bin" >> $GITHUB_PATH

      - name: Install Solana CLI & solana-verify
        run: |
          set -eo pipefail
          SOLANA_INSTALL_DIR="$HOME/.local/share/solana/install/active_release"
          SOLANA_BIN="$SOLANA_INSTALL_DIR/bin"
          curl -L --retry 5 --retry-delay 3 "https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install" | sh
          echo "$SOLANA_BIN" >> $GITHUB_PATH
          
          cargo install solana-verify --version ${{ env.SOLANA_VERIFY_VERSION }} --locked
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Clean & Build Verifiable Program inside Docker
        run: |
          set -eo pipefail
          export PATH="$HOME/.avm/bin:$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$PATH"
          anchor clean
          anchor build --verifiable -d solanafoundation/anchor:v${{ env.ANCHOR_VERSION }}

      - name: Compute Clean Hash & Prepare Artifacts
        run: |
          set -eo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          mkdir -p audit-report
          
          FILE="target/deploy/${{ env.LIBRARY_NAME }}.so"
          if [ ! -f "$FILE" ]; then
            FILE=$(find target/deploy -name "*.so" | head -n 1)
          fi
          
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "Error: Compiled .so file not found!"
            exit 1
          fi
          
          sha256sum "$FILE"
          RAW_HASH=$(solana-verify get-program-hash "$FILE")
          echo "$RAW_HASH" | grep -oE '[a-fA-F0-9]{64}' | head -n 1 | tr -d '\r\n' > audit-report/local_hash.txt
          echo "Computed Local Hash: [$(cat audit-report/local_hash.txt)]"

      - name: Upload Build Artifacts to Job 2
        uses: actions/upload-artifact@v4
        with:
          name: verifiable-program-artifacts
          path: |
            target/deploy/*.so
            target/deploy/*-keypair.json
            audit-report/

  # ==========================================
  # المرحلة الثانية: النشر والتحقق على Mainnet
  # ==========================================
  deploy:
    name: 2. Mainnet Deploy & Strict Verification
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts from Job 1
        uses: actions/download-artifact@v4
        with:
          name: verifiable-program-artifacts
          path: artifacts/

      - name: Re-organize Artifact Paths
        run: |
          mkdir -p target/deploy audit-report
          cp artifacts/*.so target/deploy/ 2>/dev/null || true
          cp artifacts/*-keypair.json target/deploy/ 2>/dev/null || true
          cp artifacts/audit-report/local_hash.txt audit-report/ 2>/dev/null || cp artifacts/local_hash.txt audit-report/ 2>/dev/null || true

      - name: Install Solana CLI & solana-verify for Deployment
        run: |
          set -eo pipefail
          SOLANA_INSTALL_DIR="$HOME/.local/share/solana/install/active_release"
          SOLANA_BIN="$SOLANA_INSTALL_DIR/bin"
          curl -L --retry 5 --retry-delay 3 "https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install" | sh
          echo "$SOLANA_BIN" >> $GITHUB_PATH
          
          cargo install solana-verify --version ${{ env.SOLANA_VERIFY_VERSION }} --locked
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Setup Wallet Keypair
        run: |
          set -eo pipefail
          install -m 600 /dev/null id.json
          printf '%s\n' '${{ secrets.VERIFY_AUTHORITY_KEYPAIR }}' > id.json

      - name: Check Wallet Balance Safely
        run: |
          set -eo pipefail
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          RPC_URL="${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}"
          RAW_BALANCE=$(solana balance --keypair id.json --url "$RPC_URL" --lamports)
          LAMPORTS=$(echo "$RAW_BALANCE" | grep -o '[0-9]*' | head -n 1)
          
          if [ -z "$LAMPORTS" ]; then
            echo "Error: Could not parse wallet balance."
            exit 1
          fi
          
          SOL=$(awk "BEGIN {print $LAMPORTS / 1000000000}")
          echo "Wallet balance: $SOL SOL ($LAMPORTS lamports)"
          
          MIN_LAMPORTS=1800000000 # 1.8 SOL
          if [ "$LAMPORTS" -lt "$MIN_LAMPORTS" ]; then
            echo "Error: Insufficient balance. Minimum required is 1.8 SOL."
            exit 1
          fi

      - name: Deploy and Verify Hash on Mainnet
        run: |
          set -eo pipefail
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$PATH"
          KEYPAIR_JSON=$(find target/deploy -name "*-keypair.json" | head -n 1)
          PROG_ID=$(solana-keygen pubkey "$KEYPAIR_JSON")
          SO_FILE=$(find target/deploy -name "*.so" | head -n 1)
          LOCAL_HASH=$(cat audit-report/local_hash.txt | tr -d '\r\n')
          RPC_URL="${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}"
          
          echo "Deploying Program ID: $PROG_ID to Mainnet..."
          solana program deploy "$SO_FILE" \
            --program-id "$KEYPAIR_JSON" \
            --keypair id.json \
            --url "$RPC_URL"
            
          ONCHAIN_RAW=$(solana-verify get-program-hash --program-id "$PROG_ID" --url "$RPC_URL")
          ONCHAIN_HASH=$(echo "$ONCHAIN_RAW" | grep -oE '[a-fA-F0-9]{64}' | head -n 1 | tr -d '\r\n')
          
          echo "Local Hash:    [$LOCAL_HASH]"
          echo "On-Chain Hash: [$ONCHAIN_HASH]"
          
          if [ "$ONCHAIN_HASH" != "$LOCAL_HASH" ]; then
            echo "Error: Hash Mismatch Detected!"
            exit 1
          fi
          
          echo "Verification Success! Local build matches On-chain bytecode 100%!"
          solana program show "$PROG_ID" --url "$RPC_URL"
          echo "PROG_ID=$PROG_ID" >> $GITHUB_ENV

      - name: Submit Remote Verification Job (OtterSec)
        run: |
          set -eo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          solana-verify remote submit-job \
            --program-id "$PROG_ID" \
            --uploader "${{ github.event.inputs.uploader_pubkey || '7WKER22cnTne1XjLk8EUiyVcTdKau9caYpaSSLXTeQUn' }}" \
            || echo "Remote job submission attempted."

      - name: Securely Shred Sensitive Keypair Files
        if: always()
        run: |
          if [ -f id.json ]; then
            shred -u id.json
          fi
