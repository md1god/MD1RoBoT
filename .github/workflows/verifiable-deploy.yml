name: Fully Automated Verifiable Build & Deploy (Mainnet)

on:
  workflow_dispatch:
    inputs:
      uploader_pubkey:
        description: 'عنوان محفظة الـ Uploader'
        required: false
        default: '7WKER22cnTne1XjLk8EUiyVcTdKau9caYpaSSLXTeQUn'

permissions:
  contents: write

env:
  LIBRARY_NAME: md1usd_solana
  ANCHOR_VERSION: 0.31.1
  SOLANA_VERSION: 2.1.0
  SOLANA_VERIFY_TAG: "v0.3.3"
  SOLANA_RPC_URL: ${{ secrets.MAINNET_RPC }}
  RUSTFLAGS: "-D warnings"

jobs:
  auto-process-and-deploy:
    name: Automated Build & Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies & Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libssl-dev libudev-dev libclang-dev protobuf-compiler
          sudo systemctl start docker

      - name: Install Node.js & Anchor CLI
        run: |
          set -eo pipefail
          npm install -g @coral-xyz/anchor-cli@${{ env.ANCHOR_VERSION }}

      - name: Install Pinned Solana CLI & solana-verify
        run: |
          set -eo pipefail
          SOLANA_INSTALL_DIR="$HOME/.local/share/solana/install/active_release"
          SOLANA_BIN="$SOLANA_INSTALL_DIR/bin"
          curl -L --retry 5 --retry-delay 3 "https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install" | sh
          echo "$SOLANA_BIN" >> $GITHUB_PATH
          
          cargo install solana-verify --git https://github.com/Ellipsis-Labs/solana-verifiable-build --tag ${{ env.SOLANA_VERIFY_TAG }} --locked
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build verifiable program automatically
        run: |
          set -eo pipefail
          anchor clean
          anchor build --verifiable -d solanafoundation/anchor:v${{ env.ANCHOR_VERSION }}

      - name: Compute local verifiable hash
        run: |
          set -eo pipefail
          FILE="target/deploy/${{ env.LIBRARY_NAME }}.so"
          if [ ! -f "$FILE" ]; then
            FILE=$(find target/deploy -name "*.so" | head -n 1)
          fi
          sha256sum "$FILE"
          solana-verify get-program-hash "$FILE" > local_hash.txt

      - name: Setup Deployment Wallet
        run: |
          set -eo pipefail
          install -m 600 /dev/null id.json
          printf '%s' '${{ secrets.VERIFY_AUTHORITY_KEYPAIR }}' > id.json

      - name: Deploy and Verify on Mainnet
        run: |
          set -eo pipefail
          KEYPAIR_JSON=$(find target/deploy -name "*-keypair.json" | head -n 1)
          PROG_ID=$(solana-keygen pubkey "$KEYPAIR_JSON")
          SO_FILE=$(find target/deploy -name "*.so" | head -n 1)
          
          RPC_URL="${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}"
          
          solana program deploy "$SO_FILE" \
            --program-id "$KEYPAIR_JSON" \
            --keypair id.json \
            --url "$RPC_URL"
            
          LOCAL_HASH=$(cat local_hash.txt)
          ONCHAIN_HASH=$(solana-verify get-program-hash --program-id "$PROG_ID" --url "$RPC_URL")
          
          if [ "$ONCHAIN_HASH" != "$LOCAL_HASH" ]; then
            echo "Error: Hash mismatch! Local: $LOCAL_HASH vs Onchain: $ONCHAIN_HASH"
            exit 1
          fi
          
          echo "Deployment and verification successful!"

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f id.json
