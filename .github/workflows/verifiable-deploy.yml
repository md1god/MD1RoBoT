          set -eo pipefail
          KEYPAIR_JSON=$(find target/deploy -name "*-keypair.json" | head -n 1)
          PROG_ID=$(solana-keygen pubkey "$KEYPAIR_JSON")
          SO_FILE=$(find target/deploy -name "*.so" | head -n 1)
          
          RPC_URL="${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}"
          
          echo "Deploying Program ID: $PROG_ID to Mainnet..."
          solana program deploy "$SO_FILE" \
            --program-id "$KEYPAIR_JSON" \
            --keypair id.json \
            --url "$RPC_URL"
            
          LOCAL_HASH=$(cat local_hash.txt | tr -d '\r\n')
