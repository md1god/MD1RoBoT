          cargo install solana-verify --version ${{ env.SOLANA_VERIFY_VERSION }} --locked
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build Verifiable Program inside Docker
        run: |
          set -eo pipefail
