name: Production Verifiable Build, Deploy and Verify

on:
  workflow_dispatch:
    inputs:
      uploader_pubkey:
        description: 'عنوان محفظة الـ Uploader (اختياري)'
        required: false
        default: '7WKER22cnTne1XjLk8EUiyVcTdKau9caYpaSSLXTeQUn'

env:
  LIBRARY_NAME: md1usd_solana
  ANCHOR_VERSION: 0.30.1 # تم تعديل الإصدار ليطابق مشروعك تماماً وتجنب التعارض
  SOLANA_VERSION: 1.18.18 # الإصدار المتوافق تماماً مع Anchor 0.30.1
  SOLANA_RPC_URL: https://api.mainnet-beta.solana.com
  RUSTFLAGS: "-D warnings"

jobs:
  build-verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check Cargo.lock presence
        run: |
          if [ ! -f "Cargo.lock" ]; then
            echo "Error: Cargo.lock is missing! Deterministic builds require a locked dependency tree."
            exit 1
          fi

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Log Tool Versions for Diagnostics
        run: |
          rustc --version
          cargo --version

      - name: Cache Cargo & AVM
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.avm
          key: ${{ runner.os }}-cargo-avm-${{ env.ANCHOR_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-avm-${{ env.ANCHOR_VERSION }}-

      - name: Install and Validate Pinned Solana CLI
        run: |
          set -eo pipefail
          sh -c "$(curl -sSfL https://release.solana.com/v${{ env.SOLANA_VERSION }}/install)"
          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"
          echo "$SOLANA_BIN" >> $GITHUB_PATH
          
          if ! "$SOLANA_BIN/solana" --version | grep -q "${{ env.SOLANA_VERSION }}"; then
            echo "Error: Solana CLI version ${{ env.SOLANA_VERSION }} not matched in output!"
            "$SOLANA_BIN/solana" --version
            exit 1
          fi
          echo "Solana CLI version verified successfully: ${{ env.SOLANA_VERSION }}"

      - name: Install and Validate AVM & Pinned Anchor CLI
        run: |
          set -eo pipefail
          AVM_BIN="$HOME/.cargo/bin/avm"
          
          if [ ! -f "$AVM_BIN" ]; then
            echo "AVM binary not found, installing via cargo..."
            cargo install avm --git https://github.com/solana-foundation/anchor --tag v${{ env.ANCHOR_VERSION }}
          fi
          
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          
          echo "Installing Anchor version ${{ env.ANCHOR_VERSION }} via avm non-interactively..."
          "$AVM_BIN" install ${{ env.ANCHOR_VERSION }}
          "$AVM_BIN" use ${{ env.ANCHOR_VERSION }}

      - name: Install solana-verify CLI
        run: |
          set -eo pipefail
          cargo install solana-verify
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify final tool versions
        run: |
          set -eo pipefail
          anchor --version
          solana --version
          solana-verify --version

      - name: Setup Wallet Keypair
        run: |
          set -eo pipefail
          install -m 600 /dev/null id.json
          printf '%s' '${{ secrets.VERIFY_AUTHORITY_KEYPAIR }}' > id.json
          solana-keygen pubkey id.json

      - name: Check wallet balance before deploy
        run: |
          set -eo pipefail
          LAMPORTS=$(solana balance --keypair id.json --url "$SOLANA_RPC_URL" --lamports | awk '{print $1}')
          SOL=$(echo "$LAMPORTS" | awk '{print $1 / 1000000000}')
          echo "Wallet balance: $SOL SOL ($LAMPORTS lamports)"
          MIN_LAMPORTS=1800000000
          if [ "$LAMPORTS" -lt "$MIN_LAMPORTS" ]; then
            echo "Error: Insufficient balance for deployment. Minimum required is 1.8 SOL."
            exit 1
          fi

      - name: Clean previous build artifacts
        run: |
          set -eo pipefail
          anchor clean

      - name: Build verifiable program
        run: |
          set -eo pipefail
          anchor build --verifiable

      - name: Locate local executable binary
        run: |
          set -eo pipefail
          FILE="target/deploy/${{ env.LIBRARY_NAME }}.so"
          if [ ! -f "$FILE" ]; then
            FILE=$(find target/deploy -name "*.so" | head -n 1)
          fi
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "Error: Compiled .so file not found!"
            exit 1
          fi
          echo "SO_FILE=$FILE" >> $GITHUB_ENV
          echo "Using file: $FILE"
          sha256sum "$FILE"

      - name: Deploy new program
        run: |
          set -eo pipefail
          solana program deploy "$SO_FILE" \
            --keypair id.json \
            --url "$SOLANA_RPC_URL"

      - name: Extract Program ID Safely
        run: |
          set -eo pipefail
          KEYPAIR_JSON="target/deploy/${{ env.LIBRARY_NAME }}-keypair.json"
          if [ ! -f "$KEYPAIR_JSON" ]; then
            KEYPAIR_JSON=$(find target/deploy -name "*-keypair.json" | head -n 1)
          fi
          if [ -z "$KEYPAIR_JSON" ] || [ ! -f "$KEYPAIR_JSON" ]; then
            echo "Error: Program keypair JSON file not found!"
            exit 1
          fi
          PROG_ID=$(solana-keygen pubkey "$KEYPAIR_JSON")
          echo "PROGRAM_ID=$PROG_ID" >> $GITHUB_ENV
          echo "Target Program ID: $PROG_ID"

      - name: Confirm on-chain deployment
        run: |
          set -eo pipefail
          solana program show "$PROGRAM_ID" --url "$SOLANA_RPC_URL"

      - name: Verify against repo (Anchor Verify)
        run: |
          set -eo pipefail
          anchor --provider.cluster mainnet verify -p ${{ env.LIBRARY_NAME }} "$PROGRAM_ID"

      - name: Submit remote verification job to OtterSec
        run: |
          set -eo pipefail
          solana-verify remote submit-job \
            --program-id "$PROGRAM_ID" \
            --uploader "${{ github.event.inputs.uploader_pubkey || '7WKER22cnTne1XjLk8EUiyVcTdKau9caYpaSSLXTeQUn' }}" \
            || echo "Remote job notification sent / processing"

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f id.json
