name: MD1RoBoT CI/CD

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      DOCKER_IMAGE: dido599999/md1robot:${{ github.sha }}

    steps:
      - name: سحب الكود من المستودع
        uses: actions/checkout@v4

      - name: إعداد Rust toolchain (لتوليد Cargo.lock)
        uses: dtolnay/rust-toolchain@stable

      - name: توليد أو تحديث Cargo.lock
        run: cargo generate-lockfile

      - name: إعداد Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: تسجيل الدخول إلى Docker Hub
        uses: docker/login-action@v3
        with:
          username: dido599999
          password: ${{ secrets.DOCKER_PAT }}

      - name: بناء ورفع صورة Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            dido599999/md1robot:latest
            ${{ env.DOCKER_IMAGE }}

      - name: إنشاء شبكة Docker محليّة
        run: |
          docker network create md1net || true

      - name: بدء حاوية Ollama
        run: |
          mkdir -p ${{ github.workspace }}/ollama_data
          docker run -d --name ollama --network md1net -p 11434:11434 \
            -v "${{ github.workspace }}/ollama_data:/root/.ollama" \
            ollama/ollama:latest

      - name: انتظار جاهزية Ollama
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:11434/ >/dev/null; then
              echo "Ollama جاهز."
              break
            fi
            echo "انتظار Ollama... ($i)"
            sleep 5
          done

      - name: تحميل نموذج Ollama (قد يستغرق وقتاً طويلاً)
        run: |
          echo 'سحب النموذج qwen2.5-coder:7b'
          # نستخدم POST كما في API Ollama
          for i in $(seq 1 6); do
            curl -sS -X POST -H "Content-Type: application/json" \
              -d '{"name":"qwen2.5-coder:7b"}' \
              http://localhost:11434/api/pull && break || true
            echo "محاولة سحب النموذج: $i/6 - الانتظار قبل المحاولة التالية..."
            sleep 30
          done

      - name: سحب صورة MD1RoBoT من Docker Hub (ضمان وجودها محلياً)
        run: |
          docker pull ${{ env.DOCKER_IMAGE }} || docker pull dido599999/md1robot:latest

      - name: تشغيل دورة تطور واحدة داخل حاوية باستخدام الشبكة المشتركة
        run: |
          docker run --rm \
            --network md1net \
            -v "${{ github.workspace }}/config.toml:/app/config.toml:ro" \
            -v "${{ github.workspace }}/memory:/app/memory" \
            -v "${{ github.workspace }}/backups:/app/backups" \
            -v "${{ github.workspace }}/ollama_data:/root/.ollama" \
            -e OLLAMA_HOST=http://ollama:11434 \
            ${{ env.DOCKER_IMAGE }} \
            /app/md1robot --run-once

      - name: تنظيف حاويات Docker (محاولة إيقاف ollama)
        if: always()
        run: |
          docker rm -f ollama || true
          docker network rm md1net || true
