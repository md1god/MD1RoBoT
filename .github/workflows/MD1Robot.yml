name: MD1RoBoT CI/CD

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DOCKER_IMAGE: dido599999/md1robot:${{ github.sha }}

    steps:
      - name: سحب الكود من المستودع
        uses: actions/checkout@v4

      - name: إعداد Rust toolchain (لتوليد Cargo.lock)
        uses: dtolnay/rust-toolchain@stable

      - name: توليد أو تحديث Cargo.lock
        run: cargo generate-lockfile

      - name: إعداد Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: تسجيل الدخول إلى Docker Hub
        uses: docker/login-action@v3
        with:
          username: dido599999
          password: ${{ secrets.DOCKER_PAT }}

      - name: بناء ورفع صورة Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            dido599999/md1robot:latest
            ${{ env.DOCKER_IMAGE }}
