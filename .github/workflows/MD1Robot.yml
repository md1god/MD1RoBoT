name: MD1RoBoT CI/CD

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434

    env:
      DOCKER_IMAGE: dido599999/md1robot:${{ github.sha }}

    steps:
      - name: سحب الكود من المستودع
        uses: actions/checkout@v4

      - name: إعداد Rust toolchain (لتوليد Cargo.lock)
        uses: dtolnay/rust-toolchain@stable

      - name: توليد أو تحديث Cargo.lock
        run: cargo generate-lockfile

      - name: إعداد Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: تسجيل الدخول إلى Docker Hub
        uses: docker/login-action@v3
        with:
          username: dido599999
          password: ${{ secrets.DOCKER_PAT }}

      - name: بناء ورفع صورة Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            dido599999/md1robot:latest
            ${{ env.DOCKER_IMAGE }}

      - name: إنشاء ملف الإعدادات
        run: |
          cat > config.toml <<'EOF'
          [evolution]
          max_cycles = 1
          health_threshold = 0.4
          [fitness_weights]
          performance = 0.35
          memory = 0.20
          reliability = 0.30
          maintainability = 0.15
          [models]
          rust = "qwen2.5-coder:7b"
          python = "qwen2.5-coder:7b"
          default = "qwen2.5-coder:7b"
          [kreza]
          use_ensemble = false
          ensemble_models = ["qwen2.5-coder:7b"]
          EOF

      - name: انتظار جاهزية Ollama
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/ >/dev/null; then
              echo "Ollama جاهز."
              break
            fi
            echo "انتظار Ollama... ($i)"
            sleep 2
          done

      - name: تحميل نموذج Ollama للتجربة
        run: |
          curl -sf http://localhost:11434/api/pull -d '{"name": "qwen2.5-coder:7b"}'

      - name: تشغيل دورة تطور واحدة
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/config.toml:/app/config.toml:ro" \
            -v "${{ github.workspace }}/memory:/app/memory" \
            -v "${{ github.workspace }}/backups:/app/backups" \
            -e OLLAMA_HOST=http://localhost:11434 \
            ${{ env.DOCKER_IMAGE }} \
            /app/md1robot --run-once
