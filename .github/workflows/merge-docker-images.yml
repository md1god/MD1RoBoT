name: Merge Docker Repositories

on:
  workflow_dispatch:

jobs:
  merge-images:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Pull and Push Images
        run: |
          docker pull dido599999/genesis-core:latest || true
          docker tag dido599999/genesis-core:latest dido599999/md1robot:genesis-core
          docker push dido599999/md1robot:genesis-core
