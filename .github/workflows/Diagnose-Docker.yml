name: Diagnose Docker Image Rust Version
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Pull the exact verification Docker image
        run: |
          docker pull solanafoundation/solana-verifiable-build:2.1.0

      - name: Check rustc version inside the image
        run: |
          docker run --rm solanafoundation/solana-verifiable-build:2.1.0 rustc --version
