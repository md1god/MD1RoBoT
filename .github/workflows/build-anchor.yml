name: Build with Anchor CLI (matching original toolchain)
on:
  workflow_dispatch:
env:
  PROGRAM_ID: 3fN2LAt47q3oSgNq4dJZt4DuAh5yJw6mb6B3dRYJGHa8
jobs:
  build-with-anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.96.1 (matches original build)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"

      - name: Install Solana CLI 4.1.0-beta.3 (matches original build)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.1.0-beta.3/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install AVM and Anchor CLI 1.1.2 (matches original build)
        run: |
          cargo install --git https://github.com/solana-foundation/anchor avm --locked --force
          avm install 1.1.2
          avm use 1.1.2
          anchor --version

      - name: Build verifiable program with Anchor itself
        run: |
          anchor build --verifiable --solana-version 4.1.0-beta.3

      - name: Get hash of the verifiable build
        run: |
          sha256sum target/verifiable/md1usd_solana.so
