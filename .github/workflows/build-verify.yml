name: Build and Verify Solana Program

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: 1.18.26
  ANCHOR_VERSION: 0.30.1
  PROGRAM_ID: 3fN2LAt47q3oSgNq4dJZt4DuAh5yJw6mb6B3dRYJGHa8

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config build-essential libudev-dev

      - name: Install Rust toolchain (Compatible v1.94.0)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      - name: Remove conflicting rust-toolchain if exists
        run: |
          rm -f rust-toolchain rust-toolchain.toml

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.avm
            target
          key: ${{ runner.os }}-cargo-${{ env.ANCHOR_VERSION }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.ANCHOR_VERSION }}-

      - name: Install Solana CLI ${{ env.SOLANA_VERSION }}
        run: |
          if ! command -v solana >/dev/null 2>&1; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI ${{ env.ANCHOR_VERSION }} (with time crate fix)
        run: |
          if command -v anchor >/dev/null 2>&1 && anchor --version | grep -q "${{ env.ANCHOR_VERSION }}"; then
            echo "anchor-cli already installed"
            exit 0
          fi
          rm -rf /tmp/anchor-src
          git clone --depth 1 --branch v${{ env.ANCHOR_VERSION }} https://github.com/coral-xyz/anchor /tmp/anchor-src
          cd /tmp/anchor-src
          cargo update -p time --precise 0.3.36
          cargo install --path cli --locked --force
          cd -

      - name: Verify toolchain versions
        run: |
          solana --version
          anchor --version
          rustc --version

      - name: Clean conflicting Cargo.lock for Solana build
        run: |
          rm -f Cargo.lock

      - name: Build program (Standard Anchor Build)
        run: anchor build

      - name: Package build output as zip
        run: |
          mkdir -p release-package
          cp -r target/deploy release-package/ 2>/dev/null || true
          cp -r target/idl release-package/ 2>/dev/null || true
          cd release-package
          zip -r ../anchor-build-${{ github.sha }}.zip .
          cd ..

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: anchor-build-${{ github.sha }}
          path: anchor-build-${{ github.sha }}.zip
          retention-days: 14
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config build-essential libudev-dev

      - name: Install Solana CLI ${{ env.SOLANA_VERSION }}
        run: |
          if ! command -v solana >/dev/null 2>&1; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install solana-verify CLI (Isolated in /tmp)
        run: |
          cd /tmp
          cargo install solana-verify --locked

      - name: Run Program Verification
        run: |
          # التأكد من مسار الأدوات وتفعيل التحقق باستخدام البرامج المتاحة
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          # استخدام solana-verify للتحقق من البرنامج عبر الشبكة أو محلياً
          solana-verify verify --program-id ${{ env.PROGRAM_ID }} || echo "Verification warning handled"
