name: Build and Verify Solana Program

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # يضيف زر تشغيل يدوي

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ سحب الكود من الريبو
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ تثبيت Rust بنفس النسخة المستقرة
      - name: Install Rust stable
        run: |
          rustup default stable
          rustup update
          rustc --version
          cargo --version

      # 3️⃣ تثبيت Anchor CLI
      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor anchor-cli --locked
          anchor --version

      # 4️⃣ تثبيت أداة solana-verify
      - name: Install solana-verify
        run: cargo install solana-verify --locked

      # 5️⃣ بناء البرنامج
      - name: Build Solana Program
        run: anchor build

      # 6️⃣ التحقق من البرنامج على الشبكة الرئيسية
      - name: Verify Program on Mainnet
        run: |
          solana-verify verify 3fN2LAt47q3oSgNq4dJZt4DuAh5yJw6mb6B3dRYJGHa8 ./target/deploy/md1usd_solana.so

      # 7️⃣ حفظ ملف الـ .so كـ artifact (اختياري لكن مفيد)
      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: md1usd_solana.so
          path: ./target/deploy/md1usd_solana.so
