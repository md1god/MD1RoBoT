name: Build and Verify Solana Program

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROGRAM_ID: 3fN2LAt47q3oSgNq4dJZt4DuAh5yJw6mb6B3dRYJGHa8

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install solana-verify CLI
        run: |
          cargo install solana-verify --locked

      - name: Build Verifiable Program inside Docker
        run: |
          # هذا الأمر يقوم ببناء المشروع داخل حاوية Docker الرسمية متجنباً أي تضارب في إصدارات الكارجو
          solana-verify build

      - name: Get Executable Hash
        run: |
          # استخراج الهاش الخاص بالملف التنفيذي الناتج للتأكد منه
          solana-verify get-executable-hash target/deploy/*.so || true

      - name: Package build output as zip
        run: |
          mkdir -p release-package
          cp -r target/deploy release-package/ 2>/dev/null || true
          cp -r target/idl release-package/ 2>/dev/null || true
          cd release-package
          zip -r ../anchor-build-${{ github.sha }}.zip .
          cd ..

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: anchor-build-${{ github.sha }}
          path: anchor-build-${{ github.sha }}.zip
          retention-days: 14
          if-no-files-found: error
