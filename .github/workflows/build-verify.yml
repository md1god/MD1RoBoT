- name: Restore original Cargo.lock if it exists in git history (optional manual step)
        run: echo "See notes — prefer restoring the original lock file if found in git history"

      - name: Configure MSRV-aware resolver
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml << 'EOF'
          [resolver]
          incompatible-rust-versions = "fallback"
          EOF

      - name: Ensure rust-version pin in workspace Cargo.toml
        run: |
          # يجب أن يحتوي كل Cargo.toml (الجذر وملف البرنامج) على:
          # rust-version = "1.75.0"
          grep -q 'rust-version' Cargo.toml || echo 'rust-version = "1.75.0"' >> Cargo.toml

      - name: Regenerate lockfile respecting MSRV
        run: |
          rm -f Cargo.lock
          cargo generate-lockfile

      - name: Fix Cargo.lock version for Rust 1.75 compatibility
        run: |
          sed -i '0,/^version = /{s/^version = 4/version = 3/}' Cargo.lock

      - name: Build Verifiable Program inside Docker
        run: |
          solana-verify build
