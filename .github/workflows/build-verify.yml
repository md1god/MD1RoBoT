name: Build and Verify Solana Program
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROGRAM_ID: 3fN2LAt47q3oSgNq4dJZt4DuAh5yJw6mb6B3dRYJGHa8

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Switch to Stable Rust to install solana-verify CLI
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          force: true

      - name: Install solana-verify CLI (using stable cargo)
        run: |
          cargo install solana-verify --locked

      - name: Configure MSRV-aware resolver
        run: |
          mkdir -p .cargo
          printf '%s\n' '[resolver]' 'incompatible-rust-versions = "fallback"' >> .cargo/config.toml
          echo "---- .cargo/config.toml ----"
          cat .cargo/config.toml

      - name: Ensure rust-version pin in all Cargo.toml files
        run: |
          for f in $(find . -name Cargo.toml -not -path "./target/*"); do
            if ! grep -q '^rust-version' "$f"; then
              sed -i '/^\[package\]/a rust-version = "1.75.0"' "$f"
            fi
            echo "---- $f ----"
            cat "$f"
          done

      - name: Regenerate lockfile respecting MSRV
        run: |
          rm -f Cargo.lock
          cargo generate-lockfile

      - name: Diagnose problematic dependency chains
        run: |
          echo "==== Root Cargo.toml ===="
          cat Cargo.toml
          echo "==== Program Cargo.toml(s) ===="
          find . -name Cargo.toml -not -path "./target/*" -exec sh -c 'echo "--- {} ---"; cat {}' \;
          echo "==== cargo tree -i indexmap ===="
          cargo tree -i indexmap || echo "not in tree"
          echo "==== cargo tree -i toml_parser ===="
          cargo tree -i toml_parser || echo "not in tree"
          echo "==== cargo tree -i toml_edit ===="
          cargo tree -i toml_edit || echo "not in tree"
          echo "==== cargo tree -i ctutils ===="
          cargo tree -i ctutils || echo "not in tree"
          echo "==== rust-version check on generated Cargo.lock ===="
          head -5 Cargo.lock
      - name: Fix Cargo.lock version for Rust 1.75 compatibility
        run: |
          sed -i '0,/^version = /{s/^version = 4/version = 3/}' Cargo.lock
          head -5 Cargo.lock

      - name: Build Verifiable Program inside Docker
        run: |
          solana-verify build

      - name: Get local executable hash
        run: |
          solana-verify get-executable-hash target/deploy/*.so

      - name: Check IDL and Deploy outputs
        run: |
          ls -la target/idl || echo "IDL folder not found"
          ls -la target/deploy || echo "Deploy folder not found"

      - name: Package build output as zip
        run: |
          mkdir -p release-package
          cp -r target/deploy release-package/ 2>/dev/null || true
          cp -r target/idl release-package/ 2>/dev/null || true
          cd release-package
          zip -r ../anchor-build-${{ github.sha }}.zip .
          cd ..

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: anchor-build-${{ github.sha }}
          path: anchor-build-${{ github.sha }}.zip
          retention-days: 14
          if-no-files-found: error
