name: Build and Verify Solana Program

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROGRAM_ID: 3fN2LAt47q3oSgNq4dJZt4DuAh5yJw6mb6B3dRYJGHa8

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Step 1 - Install Rust 1.75.0 to generate compatible project lockfile
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75.0

      - name: Generate project Cargo.lock compatible with Docker
        run: |
          rm -f Cargo.lock
          cargo generate-lockfile

      - name: Step 2 - Switch to Stable Rust to install solana-verify CLI
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          force: true

      - name: Install solana-verify CLI (using stable cargo)
        run: |
          cargo install solana-verify --locked

      - name: Step 3 - Build Verifiable Program inside Docker
        run: |
          # سيعمل الآن لأن مشروعك يمتلك ملف قفل متوافق ودون مشاكل
          solana-verify build

      - name: Check IDL and Deploy outputs
        run: |
          ls -la target/idl || echo "IDL folder not found"
          ls -la target/deploy || echo "Deploy folder not found"

      - name: Package build output as zip (includes deploy and IDL)
        run: |
          mkdir -p release-package
          cp -r target/deploy release-package/ 2>/dev/null || true
          cp -r target/idl release-package/ 2>/dev/null || true
          cd release-package
          zip -r ../anchor-build-${{ github.sha }}.zip .
          cd ..

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: anchor-build-${{ github.sha }}
          path: anchor-build-${{ github.sha }}.zip
          retention-days: 14
          if-no-files-found: error
