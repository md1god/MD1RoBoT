name: Confirm Hash Match
on:
  workflow_dispatch:

env:
  PROGRAM_ID: 3fN2LAt47q3oSgNq4dJZt4DuAh5yJw6mb6B3dRYJGHa8

jobs:
  confirm-match:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Compute hash of the repo file (strip trailing zero bytes)
        run: |
          FILE=programs/md1usd_solana/target/deploy/md1usd_solana.so
          if [ ! -f "$FILE" ]; then
            echo "Error: .so file not found in repository path!"
            exit 1
          fi
          ORIGINAL_SIZE=$(stat -c%s "$FILE")
          STRIPPED_SIZE=$(python3 -c "
          data = open('$FILE','rb').read().rstrip(b'\x00')
          print(len(data))
          ")
          head -c "$STRIPPED_SIZE" "$FILE" > stripped.so
          echo "Original size: $ORIGINAL_SIZE, Stripped size: $STRIPPED_SIZE"
          echo "Local file hash:"
          sha256sum stripped.so

      - name: Get on-chain hash directly
        run: |
          solana program dump ${{ env.PROGRAM_ID }} onchain.so --url https://api.mainnet-beta.solana.com
          ONCHAIN_STRIPPED_SIZE=$(python3 -c "
          data = open('onchain.so','rb').read().rstrip(b'\x00')
          print(len(data))
          ")
          head -c "$ONCHAIN_STRIPPED_SIZE" onchain.so > onchain_stripped.so
          echo "On-chain hash:"
          sha256sum onchain_stripped.so

      - name: Compare Hashes Automatically
        run: |
          HASH_LOCAL=$(sha256sum stripped.so | awk '{print $1}')
          HASH_ONCHAIN=$(sha256sum onchain_stripped.so | awk '{print $1}')
          
          echo "----------------------------------------"
          echo "Local Hash:    $HASH_LOCAL"
          echo "On-chain Hash: $HASH_ONCHAIN"
          echo "----------------------------------------"
          
          if [ "$HASH_LOCAL" = "$HASH_ONCHAIN" ]; then
            echo "SUCCESS: The hashes match 100% perfectly!"
          else
            echo "ERROR: Hash mismatch detected!"
            exit 1
          fi
