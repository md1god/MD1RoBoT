name: MD1RoBoT CI/CD & Cloud Training Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust environment
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo tests
        run: cargo test --verbose

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  trigger-cloud-training:
    needs: build-test-and-push  # لن يبدأ التدريب إلا بعد نجاح البناء والاختبار ورفع الصورة تماماً
    runs-on: ubuntu-latest
    steps:
      - name: Trigger training on Cloud/Gigal
        env:
          GIGAL_API_KEY: ${{ secrets.GIGAL_API_KEY }}
        run: |
          curl -X POST "https://api.gigal.ai/train" \
            -H "Authorization: Bearer $GIGAL_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "image": "ghcr.io/'"${{ github.repository }}"':latest",
              "command": "./target/release/md1robot --train",
              "gpu": true,
              "timeout_minutes": 60
            }'
