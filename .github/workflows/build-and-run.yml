name: MD1RoBoT CI/CD
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
        volumes:
          - ollama_data:/root/.ollama
    env:
      DOCKER_IMAGE: dido599999/md1robot:${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: dido599999
          password: ${{ secrets.DOCKER_PAT }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            dido599999/md1robot:latest
            ${{ env.DOCKER_IMAGE }}
      - name: Create configuration file
        run: |
          cat > config.toml <<'EOF'
          [evolution]
          max_cycles = 1
          health_threshold = 0.4
          [fitness_weights]
          performance = 0.35
          memory = 0.20
          reliability = 0.30
          maintainability = 0.15
          [models]
          rust = "qwen2.5-coder:7b"
          python = "qwen2.5-coder:7b"
          default = "qwen2.5-coder:7b"
          [kreza]
          use_ensemble = false
          ensemble_models = ["qwen2.5-coder:7b"]
          EOF
      - name: Pull Ollama model
        run: |
          curl http://localhost:11434/api/pull -d '{"name": "qwen2.5-coder:7b"}'
      - name: Run single evolution cycle
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/config.toml:/app/config.toml:ro" \
            -v "${{ github.workspace }}/memory:/app/memory" \
            -v "${{ github.workspace }}/backups:/app/backups" \
            -e OLLAMA_HOST=http://localhost:11434 \
            ${{ env.DOCKER_IMAGE }} \
            /app/md1robot --run-once
