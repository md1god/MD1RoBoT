name: Production Verifiable Build, Deploy and Verify (Mainnet)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  LIBRARY_NAME: md1usd
  ANCHOR_VERSION: 0.31.0
  SOLANA_VERSION: 2.1.0
  RUST_VERSION: 1.90.0
  SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
  RUSTFLAGS: "-D warnings"
  PROGRAM_ID: REPLACE_WITH_NEW_PROGRAM_ID

jobs:
  build:
    name: 1. Verifiable Build & Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Pinned Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo, Anchor CLI & Solana CLI
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.local/share/solana
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}-solana-${{ env.SOLANA_VERSION }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Install Modern Solana CLI (Agave)
        run: |
          set -eo pipefail
          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"
          if [ ! -x "$SOLANA_BIN/solana" ]; then
            curl -L --retry 5 --retry-delay 3 "https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install" | sh
          fi
          echo "$SOLANA_BIN" >> $GITHUB_PATH

      - name: Install Anchor CLI & solana-verify
        run: |
          set -eo pipefail
          if ! command -v anchor &> /dev/null; then
            cargo install anchor-cli --version ${{ env.ANCHOR_VERSION }} --locked
          fi
          if ! command -v solana-verify &> /dev/null; then
            cargo install solana-verify --locked
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Fix declared rust-version to match the verification toolchain
        run: |
          set -eo pipefail
          sed -i 's/rust-version = ".*"/rust-version = "${{ env.RUST_VERSION }}"/' Cargo.toml
          echo "---- Root Cargo.toml after fix ----"
          cat Cargo.toml

      - name: Verify Cargo.lock Existence
        run: |
          set -eo pipefail
          if [ ! -f "Cargo.lock" ]; then
            cargo generate-lockfile
          fi

      - name: Deterministic Build via Docker Container
        run: |
          set -eo pipefail
          solana-verify build --library-name ${{ env.LIBRARY_NAME }}

      - name: Compute Program Hash & Package Artifacts
        run: |
          set -eo pipefail
          FILE="target/deploy/${{ env.LIBRARY_NAME }}.so"
          if [ ! -f "$FILE" ]; then
            FILE=$(find target/deploy -name "*.so" | head -n 1)
          fi
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "Error: Compiled .so file not found!"
            exit 1
          fi

          LOCAL_PROGRAM_HASH=$(solana-verify get-program-hash "$FILE")
          echo "Local Program Hash: $LOCAL_PROGRAM_HASH"
          echo "$LOCAL_PROGRAM_HASH" > target/deploy/local_hash.txt

      - name: Get on-chain executable hash (informational)
        run: |
          solana-verify get-program-hash ${{ env.PROGRAM_ID }} --url ${{ env.SOLANA_RPC_URL }} || echo "On-chain hash lookup failed (network or RPC issue, or program not deployed yet) - continuing"

      - name: Check IDL and Deploy outputs
        run: |
          ls -la target/idl || echo "IDL folder not found"
          ls -la target/deploy || echo "Deploy folder not found"

      - name: Package build output as zip
        run: |
          mkdir -p release-package
          cp -r target/deploy release-package/ 2>/dev/null || true
          cp -r target/idl release-package/ 2>/dev/null || true
          cd release-package
          zip -r ../anchor-build-${{ github.sha }}.zip .
          cd ..

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: anchor-build-${{ github.sha }}
          path: anchor-build-${{ github.sha }}.zip
          retention-days: 14
          if-no-files-found: error

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verifiable-program-artifacts
          path: |
            target/deploy/*.so
            target/deploy/*-keypair.json
            target/deploy/local_hash.txt

  deploy:
    name: 2. Mainnet Deploy & Strict Verification
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: verifiable-program-artifacts
          path: target/deploy/

      - name: Setup Environment Paths
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Setup Temporary Wallet Keypair
        run: |
          set -eo pipefail
          install -m 600 /dev/null id.json
          printf '%s' '${{ secrets.VERIFY_AUTHORITY_KEYPAIR }}' > id.json

      - name: Deploy Program to Mainnet
        run: |
          set -eo pipefail
          SO_FILE=$(find target/deploy -name "*.so" | head -n 1)
          KEYPAIR_FILE=$(find target/deploy -name "*-keypair.json" | head -n 1)

          solana program deploy "$SO_FILE" \
            --program-keypair "$KEYPAIR_FILE" \
            --keypair id.json \
            --url "$SOLANA_RPC_URL"

      - name: Confirm On-Chain Hash Verification & Export Program ID
        run: |
          set -eo pipefail
          KEYPAIR_FILE=$(find target/deploy -name "*-keypair.json" | head -n 1)
          PROGRAM_ID=$(solana-keygen pubkey "$KEYPAIR_FILE")
          LOCAL_HASH=$(cat target/deploy/local_hash.txt)

          echo "Program ID: $PROGRAM_ID"
          echo "Local Hash: $LOCAL_HASH"

          ONCHAIN_HASH=$(solana-verify get-program-hash --program-id "$PROGRAM_ID" --url "$SOLANA_RPC_URL")
          echo "On-Chain Hash: $ONCHAIN_HASH"

          if [ "$ONCHAIN_HASH" != "$LOCAL_HASH" ]; then
            echo "Error: On-chain hash does not match local build hash!"
            exit 1
          fi

          echo "Hashes match perfectly!"

          echo "PROGRAM_ID=$PROGRAM_ID" >> $GITHUB_ENV

      - name: Submit verification PDA on-chain
        run: |
          set -eo pipefail
          solana config set --keypair id.json --url "$SOLANA_RPC_URL"
          yes | solana-verify verify-from-repo \
            --program-id ${{ env.PROGRAM_ID }} \
            --library-name ${{ env.LIBRARY_NAME }} \
            -u "$SOLANA_RPC_URL" \
            https://github.com/md1god/MD1usd_solana \
            || echo "PDA upload failed or RPC issue - continuing"

      - name: Submit remote verification job (OtterSec)
        run: |
          solana-verify remote submit-job \
            --program-id ${{ env.PROGRAM_ID }} \
            --uploader 7WKER22cnTne1XjLk8EUiyVcTdKau9caYpaSSLXTeQUn \
            || echo "Remote job submission failed or still processing - check Solscan later"

      - name: Cleanup Sensitive Keypair File
        if: always()
        run: |
          rm -f id.json
