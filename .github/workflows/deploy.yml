name: Verifiable Build, Deploy and Verify (Mainnet)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  LIBRARY_NAME: md1usd
  ANCHOR_VERSION: 0.30.1
  SOLANA_VERSION: 1.18.26
  RUST_VERSION: 1.75.0
  SOLANA_VERIFY_TAG: "0.4.5"
  SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: 1. Verifiable Build & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Solana & Cargo Binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.local/share/solana
          key: ${{ runner.os }}-solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}

      - name: Install Solana CLI & solana-verify
        run: |
          set -eo pipefail
          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"
          if [ ! -x "$SOLANA_BIN/solana" ]; then
            sh -c "$(curl -sSfL https://release.solana.com/v${{ env.SOLANA_VERSION }}/install)"
          fi
          echo "$SOLANA_BIN" >> $GITHUB_PATH

          if ! command -v solana-verify &> /dev/null; then
            cargo install solana-verify --version ${{ env.SOLANA_VERIFY_TAG }} --locked
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verifiable Build via Docker
        run: |
          set -eo pipefail
          solana-verify build --library-name ${{ env.LIBRARY_NAME }}

      - name: Compute Program Hash & Prepare Artifacts
        run: |
          set -eo pipefail
          FILE="target/deploy/${{ env.LIBRARY_NAME }}.so"
          if [ ! -f "$FILE" ]; then
            FILE=$(find target/deploy -name "*.so" | head -n 1)
          fi
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "Error: Compiled .so file not found!"
            exit 1
          fi

          LOCAL_PROGRAM_HASH=$(solana-verify get-program-hash "$FILE")
          echo "Computed Hash: $LOCAL_PROGRAM_HASH"
          echo "$LOCAL_PROGRAM_HASH" > target/deploy/local_hash.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verifiable-program-artifacts
          path: |
            target/deploy/*.so
            target/deploy/*-keypair.json
            target/deploy/local_hash.txt

  deploy:
    name: 2. Mainnet Deploy & Strict Hash Verification
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: verifiable-program-artifacts
          path: target/deploy/

      - name: Cache restore for CLI tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.local/share/solana
          key: ${{ runner.os }}-solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}

      - name: Setup Environment Paths
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Setup Wallet Keypair
        run: |
          set -eo pipefail
          install -m 600 /dev/null id.json
          printf '%s' '${{ secrets.VERIFY_AUTHORITY_KEYPAIR }}' > id.json

      - name: Deploy Program to Mainnet
        run: |
          set -eo pipefail
          SO_FILE=$(find target/deploy -name "*.so" | head -n 1)
          KEYPAIR_FILE=$(find target/deploy -name "*-keypair.json" | head -n 1)

          solana program deploy "$SO_FILE" \
            --program-id "$KEYPAIR_FILE" \
            --keypair id.json \
            --url "$SOLANA_RPC_URL"

      - name: Confirm On-Chain Hash Verification
        run: |
          set -eo pipefail
          KEYPAIR_FILE=$(find target/deploy -name "*-keypair.json" | head -n 1)
          PROGRAM_ID=$(solana-keygen pubkey "$KEYPAIR_FILE")
          LOCAL_HASH=$(cat target/deploy/local_hash.txt)

          echo "Program ID: $PROGRAM_ID"
          echo "Local Hash: $LOCAL_HASH"

          ONCHAIN_HASH=$(solana-verify get-program-hash --program-id "$PROGRAM_ID" --url "$SOLANA_RPC_URL")
          echo "On-Chain Hash: $ONCHAIN_HASH"

          if [ "$ONCHAIN_HASH" != "$LOCAL_HASH" ]; then
            echo "Error: On-chain hash mismatch!"
            exit 1
          fi

          echo "Verification Success! On-chain bytecode matches exactly."

      - name: Cleanup Sensitive Keypair
        if: always()
        run: |
          rm -f id.json
