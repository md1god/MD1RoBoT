name: Voice Project Update Notification

on:
  push:
    paths:
      - 'notebooks/**'
      - 'data/**'
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: إرسال تنبيه تليجرام
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          MESSAGE="🎙️ تحديث جديد في مشروع الصوت المصري%0A%0Aالملفات اتحدثت في الريبو (notebook أو lexicon أو بيانات).%0Aروح افتح Colab وشغل النسخة الجديدة:%0Ahttps://colab.research.google.com"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d text="${MESSAGE}"
